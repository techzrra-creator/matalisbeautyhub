<!-- ===================== Contact ===================== -->
<section class="contact" id="contact">
  <div class="container contact-inner">
    <div class="contact-form-wrap">
      <p class="eyebrow">Kontak &amp; Booking</p>
      <h2>Booking Jadi Lebih Mudah</h2>
      <p class="section-sub">Isi form berikut, dan pesan kamu akan langsung terkirim ke WhatsApp kami.</p>

      <form id="contact-form" class="contact-form">
        <label for="name">Nama</label>
        <input type="text" id="name" name="name" placeholder="Nama kamu" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com" required>

        <label>Pilih Layanan <span class="label-optional">(opsional, boleh lebih dari satu)</span></label>
        <div class="service-select-grid">
          <label class="service-select-option">
            <input type="checkbox" name="layanan" value="Lash Treatment">
            <span class="service-select-icon" aria-hidden="true">
              <svg viewBox="0 0 40 24"><path d="M2 20C10 4 20 2 38 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </span>
            <span class="service-select-name">Lash Treatment</span>
          </label>
          <label class="service-select-option">
            <input type="checkbox" name="layanan" value="Brow Treatment">
            <span class="service-select-icon" aria-hidden="true">
              <svg viewBox="0 0 40 24"><path d="M2 18C12 4 28 4 38 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </span>
            <span class="service-select-name">Brow Treatment</span>
          </label>
          <label class="service-select-option">
            <input type="checkbox" name="layanan" value="Nail Treatment">
            <span class="service-select-icon" aria-hidden="true">
              <svg viewBox="0 0 40 24"><circle cx="10" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="26" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            </span>
            <span class="service-select-name">Nail Treatment</span>
          </label>
          <label class="service-select-option">
            <input type="checkbox" name="layanan" value="Foot Spa & Callus">
            <span class="service-select-icon" aria-hidden="true">
              <svg viewBox="0 0 40 24"><path d="M4 20 Q10 6 20 6 Q30 6 36 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </span>
            <span class="service-select-name">Foot Spa &amp; Callus</span>
          </label>
        </div>

        <label>Pilih Terapis <span class="label-optional">(opsional)</span></label>
        <div class="therapist-grid">
          <label class="therapist-option">
            <input type="radio" name="therapist" value="Terapis 1 - Mawar">
            <span class="therapist-photo"><img src="images/logo.jpg" alt="Terapis 1" loading="lazy"></span>
            <span class="therapist-name">Mawar</span>
          </label>
          <label class="therapist-option">
            <input type="radio" name="therapist" value="Terapis 2 - Melati">
            <span class="therapist-photo"><img src="images/logo.jpg" alt="Terapis 2" loading="lazy"></span>
            <span class="therapist-name">Melati</span>
          </label>
          <label class="therapist-option">
            <input type="radio" name="therapist" value="Terapis 3 - Kirana">
            <span class="therapist-photo"><img src="images/logo.jpg" alt="Terapis 3" loading="lazy"></span>
            <span class="therapist-name">Kirana</span>
          </label>
          <label class="therapist-option">
            <input type="radio" name="therapist" value="Terapis 4 - Ayu">
            <span class="therapist-photo"><img src="images/logo.jpg" alt="Terapis 4" loading="lazy"></span>
            <span class="therapist-name">Ayu</span>
          </label>
        </div>

        <label for="message">Pesan</label>
        <textarea id="message" name="message" rows="4" placeholder="Mau booking treatment apa? Tulis di sini ya~" required></textarea>

        <button type="submit" class="btn btn-primary btn-full">Kirim </button>
      </form>
    </div>

    <div class="contact-info-wrap">
      <div class="contact-info-card">
        <h3>Info Kontak</h3>
        <ul>
          <li>
            <span class="info-label">WhatsApp</span>
            <a href="https://wa.me/6282118311020" target="_blank" rel="noopener">0821-1831-1020</a>
          </li>
          <li>
            <span class="info-label">Email</span>
            <a href="mailto:matalisbeautyhub@gmail.com">matalisbeautyhub@gmail.com</a>
          </li>
          <li>
            <span class="info-label">Instagram</span>
            <a href="https://www.instagram.com/matalisbeautyhub/" target="_blank" rel="noopener">@matalisbeautyhub</a>
          </li>
          <li>
            <span class="info-label">TikTok</span>
            <a href="https://www.tiktok.com/@matalisbeautyhub?_r=1&_t=ZS-98qfJ9VvF2L" target="_blank" rel="noopener">@matalisbeautyhub</a>
          </li>
          <li>
            <span class="info-label">Jam Buka</span>
            <span>Setiap hari, 09.00 – 21.00</span>
          </li>
        </ul>
      </div>

      <div class="map-wrap">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d15860.48788757391!2d106.8478332!3d-6.3782526!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69eda2f8b2ada9%3A0x35a4e2e186401704!2sMatalis%20Beauty%20Hub!5e0!3m2!1sen!2sid!4v1786623191129!5m2!1sen!2sid"
          width="100%" height="260" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin" title="Lokasi Matalis Beauty Hub">
        </iframe>
      </div>
    </div>
  </div>
</section>
