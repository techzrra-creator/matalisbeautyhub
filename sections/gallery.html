<!-- ===================== Gallery ===================== -->
<section class="gallery" id="gallery">

    <p class="eyebrow center">Galeri</p>

      <div class="gallery-block-head">
        <h3>Brow Bomber</h3>
        <div class="gallery-controls">
          <button class="gallery-btn gallery-prev" data-target="track-browbomber" aria-label="Foto sebelumnya">‹</button>
          <button class="gallery-btn gallery-next" data-target="track-browbomber" aria-label="Foto berikutnya">›</button>
        </div>
      </div>
      <div class="gallery-track" id="track-browbomber">
        <div class="gallery-slide"><img src="images/gallery/browbomber/1.jpeg" alt="Hasil Brow Bomber 1" loading="lazy"></div>
